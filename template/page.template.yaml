# ─────────────────────────────────────────────────────────────────────
# Blueprint Page Spec — Core Template
# ─────────────────────────────────────────────────────────────────────
# A page spec is the input a human or LLM agent writes. It describes
# intent — which visuals go on a page and what data they show — not
# pixel coordinates.
#
# Usage:
#   bp apply this-file.yaml --report <path> --guidelines <path>
#
# Discover what you can write:
#   bp describe --report <path> --guidelines <path> --json
# ─────────────────────────────────────────────────────────────────────


# ── Page identity ────────────────────────────────────────────────────
# `page:` is the display name shown in Power BI Desktop's page tab.
# The spec's identity (for re-apply matching) is the file name, or
# an explicit `id:` if you need to rename the file without creating
# a new page.

page: Sales Overview
layout: standard-dashboard


# ── Visuals ──────────────────────────────────────────────────────────
# An ordered list. Each visual fills the next free region of its role.
#
# Required per visual:
#   type     A Blueprint visual type (see `bp describe` for the list).
#            The only key every visual needs.
#
# Required by some types:
#   title    The header's text, so a `type: header` visual needs one.
#            Every other type's title is optional.
#   slots    Data bindings — which fields go into which slot. Each type's
#            contract marks the slots it requires (`bp describe` lists
#            them); a header has none.
#
# Optional per visual:
#   id         Stable identity within the page, for re-apply matching.
#              Lowercase letters, digits and hyphens, max 40.
#              Default: `<type>-<n>`, counting that type in spec order.
#              Re-apply matches on this id, so anything that renumbers
#              one type moves its visuals around:
#                - adding a second card *after* the first renumbers
#                  nothing; the new one is card-2 and is created.
#                - adding one *before* it makes the new entry card-1,
#                  which takes over the card already on the page, while
#                  the old entry is now card-2 and is created fresh.
#                - swapping two cards makes each take over the other's.
#              A takeover rebinds the fields in place and reports it; it
#              isn't refused, because Blueprint wrote both visuals and
#              neither looks edited in Desktop. Set `id:` on any type you
#              use more than once and none of this applies.
#   region     Override the visual type's default region role.
#   options    Formatting choices the visual type declares (e.g. labels,
#              legend position). See `bp describe` for available options.
#   sort       { by: <field>, direction: ascending | descending }
#              The field must be one this visual binds. Left out, the
#              visual keeps Desktop's own default sort.
#   blueprint  The one accepted value is `ignore`: this visual is placed
#              and bound by hand in Desktop on purpose. Blueprint never
#              creates, moves or binds it, and it takes no region — so
#              the entry is a note to Blueprint, not a visual it builds.
#              Its slots, options and sort are dropped if you write any.
#              Use it to keep a hand-made visual's id listed in the spec:
#              that stops `bp apply` warning that a Blueprint visual by
#              that id is no longer in the spec.

visuals:

  # ── Header ─────────────────────────────────────────────────────
  # Required when guidelines say require_title: true.
  - type: header
    title: Sales Overview

  # ── KPI — short form slots (just the field) ────────────────────
  - type: kpi
    title: Revenue vs Target
    slots:
      value: "[Total Revenue]"
      trend: "Calendar[Month]"
      target: "[Revenue Target]"

  # ── Card ───────────────────────────────────────────────────────
  - type: card
    title: Total Revenue
    region: kpi-row
    slots:
      value: "[Total Revenue]"

  # ── Column chart with options ──────────────────────────────────
  # `id:` is optional, but it pins this visual's identity across
  # re-applies no matter what is added above it.
  - type: column
    id: revenue-by-region
    title: Revenue by Region
    options: { labels: "on" }
    sort: { by: "[Total Revenue]", direction: descending }
    slots:
      category: "Geography[Region]"
      value: "[Total Revenue]"

  # ── Table — an ordered list is the column order, left to right ─
  - type: table
    title: Order Detail
    slots:
      columns:
        - "Geography[Region]"
        - "Product[Category]"
        - "[Total Revenue]"
        - "[Order Count]"


# ─────────────────────────────────────────────────────────────────────
# Slot syntax reference
# ─────────────────────────────────────────────────────────────────────
#
# ── A slot holds a field ──
#
#   value: "[Total Revenue]"          a measure
#   value: "Table[Column]"            a column
#   value: "Table[Hierarchy]"         a model hierarchy (binds all levels)
#
#   One way to write one thing: a field is a string. Anything a slot
#   needs beyond the field is a mapping key — see "the long form" below.
#
#
# ── Drill-down paths (ordered lists) ──
#
#   An ordered list in a slot creates a drill-down hierarchy in the
#   visual. The user clicks through levels in Power BI Desktop.
#   This is core functionality — every analytical page uses it.
#
#   category:
#     - "Geography[Country]"
#     - "Geography[State]"
#     - "Geography[City]"
#
#   A list in a `value` slot means one series per measure instead
#   (probe 20). `bp describe` marks which slots take a list.
#
#
# ── Sorting a visual ──
#
#   sort: { by: "[Total Revenue]", direction: descending }
#   sort: { by: "Geography[Region]", direction: ascending }
#
#   One sort per visual, on a field the visual shows — that is what
#   Desktop stores (probe 31). Leave `sort` out and Desktop's own
#   default stands; a sort you set in Desktop is left alone too.
#
#
# ── Saying more about a field: the long form ──
#
#   A slot entry can be a mapping instead of a string. The two forms
#   mean the same thing when only `field` is set:
#
#     value: "Sales[Amount]"
#     value: { field: "Sales[Amount]" }
#
#   The mapping is the only way to add a per-slot decision:
#
#     value:
#       field: "Sales[Amount]"
#       aggregate: sum             # summarise the column in this visual
#       format: "#,0.00"           # a Power BI format string
#
# ── aggregate (a column summarised in the visual) ──
#
#   sum  average  min  max         as the names say
#   count                          Desktop's "Count": non-null values
#   distinctcount                  Desktop's "Count (Distinct)"
#
#   Only where the slot takes a measure: an aggregated column is a
#   value, so `category: {aggregate: sum}` is refused.
#   Use a measure when the calculation is reusable business logic;
#   use `aggregate` for a one-off summary in one visual.
#
#   Codes come from probe 29, where each was chosen on a fresh field
#   in Desktop. Two fields Desktop would name alike (count and
#   distinct count of one column) are refused rather than guessed.
#
# ── format (a format string scoped to the visual) ──
#
#   format: "#,0"                  1,234
#   format: "#,0.00"               1,234.56
#   format: "0.00%"                45.20%
#   format: '"$" #,0.00;("$" #,0.00);"$" #,0.00'      $1,234.56
#
#   The string is written exactly as given. Blueprint has no `currency`
#   shorthand on purpose: probe 29 showed Desktop writes the *locale's*
#   symbol, so a shorthand would mean Blueprint inventing one.
#   A measure's own format lives in the model (TMDL formatString) and
#   is a different thing; this one is per visual.
#
# ─────────────────────────────────────────────────────────────────────
