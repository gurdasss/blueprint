# ─────────────────────────────────────────────────────────────────────
# Blueprint Page Spec — Core Template
# ─────────────────────────────────────────────────────────────────────
# A page spec is the input a human or LLM agent writes. It describes
# intent — which visuals go on a page and what data they show — not
# pixel coordinates.
#
# Usage:
#   bp apply this-file.yaml --report <path> --guidelines <path>
#
# Discover what you can write:
#   bp describe --report <path> --guidelines <path> --json
# ─────────────────────────────────────────────────────────────────────


# ── Page identity ────────────────────────────────────────────────────
# `page:` is the display name shown in Power BI Desktop's page tab.
# The spec's identity (for re-apply matching) is the file name, or
# an explicit `id:` if you need to rename the file without creating
# a new page.

page: Sales Overview
layout: standard-dashboard


# ── Visuals ──────────────────────────────────────────────────────────
# An ordered list. Each visual fills the next free region of its role.
#
# Required per visual:
#   type     A Blueprint visual type (see `bp describe` for the list).
#   title    The visual's display title.
#   slots    Data bindings — which fields go into which slot.
#
# Optional per visual:
#   region   Override the visual type's default region role.
#   options  Formatting choices the visual type declares (e.g. labels,
#            legend position). See `bp describe` for available options.

visuals:

  # ── Header ─────────────────────────────────────────────────────
  # Required when guidelines say require_title: true.
  - type: header
    title: Sales Overview

  # ── KPI — short form slots (just the field) ────────────────────
  - type: kpi
    title: Revenue vs Target
    slots:
      value: "[Total Revenue]"
      trend: "Calendar[Month]"
      target: "[Revenue Target]"

  # ── Card ───────────────────────────────────────────────────────
  - type: card
    title: Total Revenue
    region: kpi-row
    slots:
      value: "[Total Revenue]"

  # ── Column chart with options ──────────────────────────────────
  - type: column
    title: Revenue by Region
    options: { labels: "on" }
    slots:
      category: "Geography[Region]"
      value: "[Total Revenue]"

  # ── Table — an ordered list is the column order, left to right ─
  - type: table
    title: Order Detail
    slots:
      columns:
        - "Geography[Region]"
        - "Product[Category]"
        - "[Total Revenue]"
        - "[Order Count]"


# ─────────────────────────────────────────────────────────────────────
# Slot syntax reference
# ─────────────────────────────────────────────────────────────────────
#
# ── A slot holds a field ──
#
#   value: "[Total Revenue]"          a measure
#   value: "Table[Column]"            a column
#   value: "Table[Hierarchy]"         a model hierarchy (binds all levels)
#
#   One way to write one thing: a field is a string. Anything a slot
#   needs beyond the field will be a mapping key (see "Not built yet").
#
#
# ── Drill-down paths (ordered lists) ──
#
#   An ordered list in a slot creates a drill-down hierarchy in the
#   visual. The user clicks through levels in Power BI Desktop.
#   This is core functionality — every analytical page uses it.
#
#   category:
#     - "Geography[Country]"
#     - "Geography[State]"
#     - "Geography[City]"
#
#   A list in a `value` slot means one series per measure instead
#   (probe 20). `bp describe` marks which slots take a list.
#
#
# ── Not built yet: per-slot decisions ──
#
#   Nothing below is accepted by `bp apply` today. It is recorded here
#   so the shape is settled when the evidence is:
#
#     value:
#       field: "Sales[Amount]"        # a mapping = field + decisions
#       aggregate: sum                # visual-level aggregation
#       format: "#,0.00"              # format string scoped to the visual
#
#   The mapping form is the only planned way to say more about a field.
#   An earlier draft of this template also showed a pipe syntax
#   ("Sales[Amount] | distinctcount"); that is dropped. It is a second
#   language inside a string, invisible to validation, and it says what
#   `aggregate:` already says.
#
#   Why it waits: `apply` writes what a Desktop probe has verified, and
#   neither shape is verified yet.
#     - aggregate: Desktop's read shape is known (probes 10, 13:
#       {"Aggregation": {"Expression": {"Column": …}, "Function": N}}),
#       and codes 0 Sum, 1 Average, 5 Count are attested. The codes for
#       distinct count, min and max are not, and Blueprint writing any
#       of them is unverified. An aggregated column also puts a column
#       in a measure-only slot, so a slot has to accept that kind.
#     - format: the vendored Microsoft schema (visualConfiguration
#       2.8.0) carries a per-projection "format" — "format string scoped
#       to the visual" — so the unit is a Power BI format string, not a
#       named enum. A table of friendly names (currency, percentage)
#       would make Blueprint invent a currency symbol and decimal
#       places; naming them belongs in an extension, over a core that
#       takes the string the client wrote.
#
#   See template/plan.md step 5 and blueprint/pbir/schema.md.
# ─────────────────────────────────────────────────────────────────────
