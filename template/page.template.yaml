# ─────────────────────────────────────────────────────────────────────
# Blueprint Page Spec — Core Template
# ─────────────────────────────────────────────────────────────────────
# A page spec is the input a human or LLM agent writes. It describes
# intent — which visuals go on a page and what data they show — not
# pixel coordinates.
#
# Usage:
#   bp apply this-file.yaml --report <path> --guidelines <path>
#
# Discover what you can write:
#   bp describe --report <path> --guidelines <path> --json
# ─────────────────────────────────────────────────────────────────────


# ── Page identity ────────────────────────────────────────────────────
# `page:` is the display name shown in Power BI Desktop's page tab.
# The spec's identity (for re-apply matching) is the file name, or
# an explicit `id:` if you need to rename the file without creating
# a new page.

page: Sales Overview
layout: standard-dashboard


# ── Visuals ──────────────────────────────────────────────────────────
# An ordered list. Each visual fills the next free region of its role.
#
# Required per visual:
#   type     A Blueprint visual type (see `bp describe` for the list).
#   title    The visual's display title.
#   slots    Data bindings — which fields go into which slot.
#
# Optional per visual:
#   region   Override the visual type's default region role.
#   options  Formatting choices the visual type declares (e.g. labels,
#            legend position). See `bp describe` for available options.

visuals:

  # ── Header ─────────────────────────────────────────────────────
  # Required when guidelines say require_title: true.
  - type: header
    title: Sales Overview

  # ── KPI — short form slots (just the field) ────────────────────
  - type: kpi
    title: Revenue vs Target
    slots:
      value: "[Total Revenue]"
      trend: "Calendar[Month]"
      target: "[Revenue Target]"

  # ── Card — long form slot (field + format) ─────────────────────
  # When a slot needs micro decisions, use the long form:
  #   { field: <field>, format: <named format> }
  - type: card
    title: Unique Investors
    region: kpi-row
    slots:
      value:
        field: "Investors[ID] | distinctcount"
        format: whole_number                     # → 1,234

  # ── Column chart with options and formatted value ──────────────
  - type: column
    title: Revenue by Region
    options: { labels: "on" }
    slots:
      category: "Geography[Region]"
      value:
        field: "[Total Revenue]"
        format: currency                         # → $1,234.56

  # ── Table — mixed short and long form ──────────────────────────
  - type: table
    title: Order Detail
    slots:
      columns:
        - "Geography[Region]"
        - "Product[Category]"
        - field: "[Total Revenue]"
          format: currency
        - "[Order Count]"


# ─────────────────────────────────────────────────────────────────────
# Slot syntax reference
# ─────────────────────────────────────────────────────────────────────
#
# ── Short form (just the field — the common case) ──
#
#   value: "[Total Revenue]"
#   value: "Table[Column]"
#   value: "Table[Column] | distinctcount"
#
# ── Long form (field + optional micro decisions) ──
#
#   value:
#     field: "[Total Revenue]"
#     format: currency
#
# The short form and long form are interchangeable. Use the short form
# when the field is all you need. Use the long form when you also want
# to set a data format.
#
#
# ── Field syntax ──
#
#   "[Measure Name]"                  a measure
#   "Table[Column]"                   a column
#   "Table[Hierarchy]"                a model hierarchy (binds all levels)
#
#
# ── Drill-down paths (ordered lists) ──
#
#   An ordered list in a slot creates a drill-down hierarchy in the
#   visual. The user clicks through levels in Power BI Desktop.
#   This is core functionality — every analytical page uses it.
#
#   category:
#     - "Geography[Country]"
#     - "Geography[State]"
#     - "Geography[City]"
#
#
# ── Aggregated columns (visual-level aggregation) ──
#
#   "Table[Column] | sum"             Sum
#   "Table[Column] | average"         Average
#   "Table[Column] | distinctcount"   Distinct count
#   "Table[Column] | count"           Count (non-null values)
#   "Table[Column] | min"             Minimum
#   "Table[Column] | max"             Maximum
#
#   Use a measure when the aggregation is reusable business logic.
#   Use `| aggregate` for a one-off visual-level summary.
#
#
# ── Named data formats (optional, per slot) ──
#
#   general        Power BI's default (no specific formatting)
#   whole_number   1,234
#   decimal        1,234.56
#   currency       $1,234.56
#   percentage     45.20%
#
#   Omit format to use Power BI's default for the field's data type.
#   Fine-grained overrides (decimal places, thousand separator) are
#   available through extensions.
# ─────────────────────────────────────────────────────────────────────
