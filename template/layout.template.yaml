# ─────────────────────────────────────────────────────────────────────
# Blueprint Layout — Core Template
# ─────────────────────────────────────────────────────────────────────
# A layout is a named arrangement of regions on a canvas. Each region
# is a rectangle that a visual fills. `bp apply` places visuals into
# regions by matching their role.
#
# A layout file lives in a directory on the guidelines' search_path.
# The file name (without .yaml) is the layout name a page spec uses.
#
# Pixels are the only unit in this version. The client states every
# coordinate; Blueprint never derives one. That means a little arithmetic
# up front (worked out for you at the bottom of this file) in exchange for
# a layout that is exactly what it says. Relative positioning — rows and
# column counts that Blueprint turns into pixels — is a later version; see
# template/extensions.md.
#
# Rules enforced by `bp apply`:
#   - Every region must sit on the guidelines grid.
#   - Every region must be inside the guidelines margin.
#   - Every pair of regions must be at least the guidelines gutter apart.
#   - Violating any of these refuses the layout, not the spec.
# ─────────────────────────────────────────────────────────────────────


# ── Identity ─────────────────────────────────────────────────────────
# The name must match the file name. This is what a page spec writes
# in its `layout:` field.

name: standard-dashboard


# ── Canvas ───────────────────────────────────────────────────────────
# Must match the guidelines canvas dimensions exactly. A layout built
# for 1280×720 refuses to run under guidelines that say 1920×1080.

canvas:
  width: 1280
  height: 720


# ── Regions ──────────────────────────────────────────────────────────
# An ordered list of named rectangles. Visuals fill regions of their
# role in declaration order: the first `main` visual gets the first
# `main` region, the second gets the second, and so on.
#
# Each region has:
#   role   What kind of visual fills it. Core roles:
#            header   — the page title textbox
#            kpi-row  — KPI cards and small summary visuals
#            main     — charts, tables, matrices — everything else
#   x, y   Top-left corner in pixels (must be on the grid)
#   w, h   Width and height in pixels (edges must be on the grid)
#
# Running out of regions is an error. Unfilled regions are gaps
# (a warning, never a reflow).
#
# Nothing here is trusted: `bp apply` refuses the layout and names the
# breakage before it writes anything, e.g.
#   region main#2 is off the 8px grid (right=1277.55)
#   region header#1 is inside the 16px margin (left)
#   regions main#1 and main#2 are 8px apart, less than the 16px gutter

regions:
  - { role: header,  x: 16,  y: 16,  w: 1248, h: 64 }
  - { role: kpi-row, x: 16,  y: 96,  w: 616,  h: 160 }
  - { role: kpi-row, x: 648, y: 96,  w: 616,  h: 160 }
  - { role: main,    x: 16,  y: 272, w: 616,  h: 432 }
  - { role: main,    x: 648, y: 272, w: 616,  h: 432 }


# ── Doing the arithmetic (not parsed) ───────────────────────────────
# This layout assumes the template guidelines: canvas 1280x720,
# grid: 8, margin: 16, gutter: 16.
#
# Step 0 — check the canvas is usable at all. Both must be whole
# multiples of the grid, or no region can start at the margin and end
# at canvas - margin on grid:
#
#   (1280 - 2x16) % 8 == 0   ->  1248 usable width   ok
#   ( 720 - 2x16) % 8 == 0   ->   688 usable height  ok
#
#   (A grid of 10 would fail here: 1248 is not a multiple of 10.
#    Change the margin or the grid, not the layout.)
#
# Step 1 — columns. Equal columns with equal gaps, every number a
# multiple of the grid, each gap at least the gutter, filling the
# usable width exactly. For 1248 usable and a 16px gutter:
#
#   columns   width each   gap     check
#   1         1248         -       1248
#   2          616         16      2x616 + 16      = 1248
#   3          400         24      3x400 + 2x24    = 1248
#   4          288         32      4x288 + 3x32    = 1248
#   5          224         32      5x224 + 4x32    = 1248
#   6          168         48      6x168 + 5x48    = 1248
#
#   x positions: margin, then + width + gap each time.
#   2 columns -> 16, 648.   3 -> 16, 440, 864.   4 -> 16, 336, 656, 976.
#
#   Note the gap grows past the 16px gutter at three columns and more.
#   That is fine: the gutter is a minimum, and staying on the grid wins.
#
# Step 2 — rows. Same idea vertically, using the heights you need:
#
#   header  64   (a 20pt title textbox)
#   kpi-row 160  (at 120px Desktop clips a KPI's goal line and a
#                 titled card's label - measured, not a guess)
#   main    rest = 688 - 64 - 160 - 2x16 = 432
#
#   y positions: 16, then + height + gutter: 16, 96, 272.
#
# Step 3 — hand it to Blueprint. `bp apply` re-checks all of it against
# the guidelines actually in force and refuses the layout if any edge is
# off. The numbers above are a starting point, not an authority.
# ─────────────────────────────────────────────────────────────────────
