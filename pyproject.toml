[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-pbi"
dynamic = ["version"]
description = "Declarative, deterministic Power BI (PBIP/PBIR) report layouts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
bp = "blueprint.cli:main"

[tool.setuptools.dynamic]
version = { attr = "blueprint.__version__" }

[tool.setuptools.packages.find]
include = ["blueprint*"]

[tool.setuptools.package-data]
blueprint = ["*.yaml", "pbir/schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
