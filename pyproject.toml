[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-pbi"
dynamic = ["version"]
description = "Declarative, deterministic Power BI (PBIP/PBIR) report layouts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["power-bi", "powerbi", "pbip", "pbir", "report-layout", "linter", "yaml"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/gurdasss/blueprint"
Source = "https://github.com/gurdasss/blueprint"
Changelog = "https://github.com/gurdasss/blueprint/blob/main/CHANGELOG.md"
Issues = "https://github.com/gurdasss/blueprint/issues"

[project.optional-dependencies]
# `bp mcp`: serve every bp command as an MCP tool over stdio. Optional, so a plain
# `pip install blueprint-pbi` still gives `bp` and nothing else. Written against mcp 2.3.0's
# MCPServer (mcp 2.x renamed FastMCP), hence the major-version bound.
mcp = [
    "mcp>=2.3,<3",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mcp>=2.3,<3",
]

[project.scripts]
bp = "blueprint.cli:main"

[tool.setuptools.dynamic]
version = { attr = "blueprint.__version__" }

[tool.setuptools.packages.find]
include = ["blueprint*"]

[tool.setuptools.package-data]
blueprint = ["*.yaml", "visuals/*.yaml", "starter/*.yaml", "starter/layouts/*.yaml", "starter/pages/*.yaml", "pbir/schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
