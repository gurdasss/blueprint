# Slot contract for spec type `stacked-bar` (stacked bar). Verified in probe 22 (pbir/schema.md "Creating pages
# and visuals"): `barChart` with the clustered chart's roles, X axis `Category` ("active": true) and
# `Y`, plus Legend `Series` (a column, no "active"). Desktop drew it stacking the Legend within each
# category and found nothing to rewrite. Only one category column and one measure were probed.
type: stacked-bar
visual_type: barChart
region: main
slots:
  category: { role: Category, accepts: column, required: true }
  value:    { role: Y, accepts: measure, required: true }
  legend:   { role: Series, accepts: column }
