# Slot contract for spec type `area`. Verified in probes 22 and 23 (pbir/schema.md "Creating pages
# and visuals"): `areaChart` with the line chart's roles, X axis `Category` ("active": true), Y axis
# `Y` (a list: one series per measure, probe 23) and Legend `Series` (no "active", probe 22).
# Probe 27: an ordered list of columns on the X axis is a drill-down (drawn expanded), and Desktop
# refuses a second Legend column, so the Legend takes one. Probe 28: a drill-down together with a
# Legend draws; several measures together with a Legend don't (Desktop's error), so refused.
type: area
visual_type: areaChart
region: main
slots:
  category: { role: Category, accepts: column, required: true, ordered: true, active: true }
  value:    { role: Y, accepts: measure, required: true, ordered: true, list_excludes: [legend] }
  legend:   { role: Series, accepts: column }
options:
# Probe 35: Desktop drew and kept this type's `labels` and the whole `legend` option (positions and
# `off` = legend.show false), so it behaves like the core's column, bar and line.
  labels: { object: labels, property: show, values: { "on": "true" } }
  legend: { object: legend, property: position, values: { top: "'Top'", bottom: "'Bottom'", left: "'Left'", right: "'Right'", "off": { property: show, literal: "false" } } }
