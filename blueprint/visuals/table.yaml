# Slot contract for spec type `table`. Verified in probe 08: `tableEx`, every column and measure in
# role `Values`, in the order given (reordering the well only reorders the projections). Probe 16:
# a hierarchy built in the model adds all its levels as columns.
type: table
visual_type: tableEx
region: main
slots:
  columns: { role: Values, accepts: [column, measure, hierarchy], required: true, ordered: true }
options:
  # Probe 32: `objects.total[0].properties.totals = false` removes the Total row, `true` and no
  # object show it (Desktop's default is on). Kept as written through a save.
  totals: { object: total, property: totals, values: { "on": "true", "off": "false" } }
