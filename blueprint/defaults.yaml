# Layer 1: built-in defaults. Organisation guidelines, per-report overrides and
# command-line flags are layered on top (later wins). See README "Guidelines and layering".
#
# Defaults are deliberately permissive: anything organisation-specific (canvas size,
# margins, density budgets) is off until a guidelines file turns it on.
version: 1
name: Blueprint defaults

canvas:
  width: null    # null: page size is not checked
  height: null

spacing:
  grid: 8
  margin: 0      # minimum distance from visual edges to the page edge
  gutter: 0      # minimum gap between neighbouring visuals (0: not checked)

page:
  max_visuals: null        # null: no density budget
  # How visuals are counted against max_visuals (see blueprint/policies.py):
  #   all      every visual container except groups
  #   visible  as `all`, minus hidden visuals
  #   data     visible visuals bound to fields (excludes textboxes, images, shapes)
  density_policy: visible
  # Title rules apply to pages built from a spec (their header is known exactly). Hand-built
  # pages don't mark a title, so they aren't checked (bp check notes how many were skipped).
  require_title: false     # the page must have a header (a `type: header` visual)
  title_region: null       # the region role its header must be in, e.g. header; null: any

palette:
  categorical: []      # empty: palette not checked
  background: null
  text: null
  extra: []            # other allowed colours, e.g. approved shades (theme shades picked for
                       # textbox text are stored as resolved hex and must be listed here)
  enforce: strict      # strict: violations are errors | warn: warnings | off

layouts:
  search_path: []      # directories of <name>.yaml layouts; relative to the file declaring them
  default: null        # layout used when a page spec doesn't name one

# typography: per text role, the allowed font face(s) and size(s) in pt. Roles:
# page_title (the textboxes bp apply creates for `type: header`),
# visual_title (chart/card/table titles),
# body (everything else: labels, textboxes, data labels).
# A font weight is part of the face name, exactly as in Desktop's font list
# (e.g. "Segoe UI Semibold"). Nothing is checked by default.
#   typography:
#     page_title:    {font: Segoe UI Semibold, size: 18}
#     visual_title:  {font: Segoe UI, size: 12}
#     body:          {font: [Segoe UI, Segoe UI Light], size: [10, 12]}
