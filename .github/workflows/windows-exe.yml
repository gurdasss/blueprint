name: windows-exe

# Builds the standalone bp.exe (engine + interpreter, PyInstaller one-file) and gates it:
# the exe must behave byte for byte like the pip-installed bp when run with no Python on PATH
# and the source package moved out of the way, and `bp.exe mcp` must answer a recorded MCP
# client session in both protocol eras. Builds and uploads an artifact only; it
# publishes nothing.
on:
  push:
    branches: [feat/vscode-mcp-extension]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Non-editable, so the exe is built from the installed package -- what the wheel carries.
      # With the [mcp] extra: the exe always includes `bp mcp`, and the reference run needs it.
      - name: Install Blueprint and PyInstaller
        run: pip install ".[mcp]" pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10

      - name: Build bp.exe
        # Work dir outside the tree: `pip install .` leaves its own build/ there.
        run: pyinstaller --noconfirm --clean --workpath "$RUNNER_TEMP/pyi-build" packaging/windows/bp.spec

      - name: Prepare gate inputs
        run: |
          mkdir -p "$RUNNER_TEMP/inputs"
          cp -r guidelines "$RUNNER_TEMP/inputs/"
          cp examples/sales-overview.yaml "$RUNNER_TEMP/inputs/"
          cp -r fixtures/02-card-and-chart "$RUNNER_TEMP/inputs/report"
          cp dist/bp.exe "$RUNNER_TEMP/bp.exe"

      # The exe runs from outside the checkout, with the source package renamed and a PATH
      # that holds only Git Bash's coreutils and System32. The step fails if any Python is
      # reachable on that PATH.
      - name: Gate -- run the exe with no Python
        run: |
          mv blueprint blueprint.hidden
          export PATH="/usr/bin:/c/Windows/System32"
          for p in python python3 py; do
            if command -v "$p"; then echo "::error::$p is on the gate PATH"; exit 1; fi
          done
          echo "no Python on PATH: $PATH"
          bash packaging/windows/gate.sh "$RUNNER_TEMP/bp.exe" "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/gate-exe"
          mv blueprint.hidden blueprint

      # The exe forces UTF-8 on stdout/stderr (bp_entry.py); the pip-installed bp would write a
      # redirected stream in the ANSI code page, so the reference gets UTF-8 mode to compare
      # like with like. This is test setup only: the PyPI bp on Windows is deliberately unchanged.
      - name: Gate -- reference run with the pip-installed bp
        env:
          PYTHONUTF8: "1"
        run: bash packaging/windows/gate.sh bp "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/gate-ref"

      - name: Gate -- compare
        run: python packaging/windows/verify_gate.py "$RUNNER_TEMP/gate-exe" "$RUNNER_TEMP/gate-ref"

      # The VS Code extension, in a real VS Code: the oldest version it declares (engines ^1.101.0)
      # and the latest stable. It activates, defines bp.exe as an MCP server, and the definition
      # it returns is started and answers a recorded client session; plus the stable copy for
      # other MCP clients. Each run gets a fresh copy of the gate inputs as its workspace.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Extension -- integration test in VS Code
        working-directory: vscode-extension
        env:
          BP_TEST_SESSION: ${{ github.workspace }}/packaging/windows/mcp-session-legacy.jsonl
        run: |
          npm ci
          mkdir -p bin && cp ../dist/bp.exe bin/
          for v in 1.101.0 stable; do
            echo "::group::VS Code $v"
            ws="$RUNNER_TEMP/ext-ws-$v"
            rm -rf "$ws" && cp -r "$RUNNER_TEMP/inputs" "$ws"
            BP_TEST_WORKSPACE="$ws" VSCODE_VERSION="$v" npm test
            echo "::endgroup::"
          done

      # The installable extension, from the exe the gate and the integration test just passed.
      # Packaged only: publishing is a separate, manual decision.
      - name: Extension -- package the .vsix (win32-x64)
        working-directory: vscode-extension
        run: |
          # --out names the file unless the folder already exists (vsce package.js: stat, isDirectory)
          mkdir -p "$RUNNER_TEMP/vsix"
          npx vsce package --target win32-x64 --out "$RUNNER_TEMP/vsix"
          vsix=$(ls "$RUNNER_TEMP"/vsix/*.vsix)
          echo "packaged: $vsix"
          python -I -c "import hashlib, sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); print(sorted(z.namelist())); a = hashlib.sha256(z.read('extension/bin/bp.exe')).hexdigest(); b = hashlib.sha256(open(sys.argv[2], 'rb').read()).hexdigest(); print('bin/bp.exe', a); sys.exit(0 if a == b else 'the exe in the .vsix is not the one the gate tested')" "$vsix" ../dist/bp.exe

      - uses: actions/upload-artifact@v7
        with:
          name: blueprint-vsix
          path: ${{ runner.temp }}/vsix/*.vsix
          if-no-files-found: error

      - name: Show the exe's describe output
        if: always()
        run: |
          cat "$RUNNER_TEMP/gate-exe/version.out" || true
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print(len(d['types']), 'types:', ', '.join(d['types']))" "$RUNNER_TEMP/gate-exe/describe.out" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bp-windows-exe
          path: |
            dist/bp.exe
            ${{ runner.temp }}/gate-exe
            ${{ runner.temp }}/gate-ref
          if-no-files-found: warn
          # The gate's written report includes dot-files (.platform, .blueprint.manifest.json),
          # which upload-artifact leaves out by default (action.yml: include-hidden-files 'false').
          include-hidden-files: true
