# Named layout from the README, used by bp apply: a header, a KPI row and two main regions.
# The KPI row is 160px: at 120px Desktop clips a KPI visual's goal line and a titled card's label.
name: standard-4-up
canvas: { width: 1280, height: 720 }
regions:
  - { role: header,  x: 16,  y: 16,  w: 1248, h: 64 }
  - { role: kpi-row, x: 16,  y: 96,  w: 1248, h: 160 }
  - { role: main,    x: 16,  y: 272, w: 616,  h: 432 }
  - { role: main,    x: 648, y: 272, w: 616,  h: 432 }
