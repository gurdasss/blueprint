# Invented example guidelines, committed so anyone can run the tool. Not any real
# organisation's standard. Keep real guideline files out of this repo (they're gitignored).
version: 1
name: Example Corp Reporting Standard

canvas:
  width: 1280
  height: 720

spacing:
  grid: 8
  margin: 16
  gutter: 16      # minimum gap between neighbouring visuals

palette:
  categorical: ["#4E79A7", "#F28E2B", "#E15759", "#76B7B2", "#59A14F"]
  background: "#FFFFFF"
  text: "#333333"
  enforce: strict        # strict | warn | off

typography:
  page_title:    { font: Segoe UI Semibold, size: 20 }   # bp apply writes this onto header textboxes
  visual_title:  { font: Segoe UI Semibold, size: 18 }   # weight is part of the face name
  body:          { font: Segoe UI, size: 12 }

page:
  require_title: true
  title_region: header
  max_visuals: 6
  density_policy: data   # named policy in blueprint/policies.py: all | visible | data

layouts:
  search_path: ["layouts"]     # relative to this file
  default: standard-4-up
